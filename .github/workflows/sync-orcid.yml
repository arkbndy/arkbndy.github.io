name: Sync publications from ORCID

on:
  schedule:
    # 06:15 UTC on the 1st of every month
    - cron: "15 6 1 * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch ORCID record and merge new works
        env:
          ORCID_ID: 0000-0003-3386-4289
          CROSSREF_MAILTO: arka.bandyopadhyay@uni-wuerzburg.de
        run: python3 scripts/sync_orcid.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/publications.json; then
            echo "No new publications."
            exit 0
          fi
          git config user.name  "orcid-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          git commit -m "Sync new publications from ORCID"
          git push
